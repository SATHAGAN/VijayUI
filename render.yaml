databases:
  - name: ohc-db
    databaseName: ohc
    plan: free        # free Postgres expires after 30 days on Render; use a paid plan for production
services:
  - type: web
    name: ohc-data-hub
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ohc-db
          property: connectionString
      - key: APP_PASSWORD     # set in the Render dashboard; enables HTTP Basic auth (any username)
        sync: false
